packages:
    - 'apps/*'
    - 'packages/*'

allowBuilds:
    '@nestjs/core': true
    '@parcel/watcher': false
    '@scarf/scarf': true
    '@swc/core': true
    esbuild: true
    msgpackr-extract: true
    pnpm: true
    protobufjs: false
    unrs-resolver: true
    workerd: false

minimumReleaseAgeExclude:
    - '@better-auth/core@1.7.24'
    - '@better-auth/drizzle-adapter@1.7.24'
    - '@better-auth/kysely-adapter@1.7.24'
    - '@better-auth/memory-adapter@1.7.24'
    - '@better-auth/mongo-adapter@1.7.24'
    - '@better-auth/prisma-adapter@1.7.24'
    - '@better-auth/telemetry@1.7.24'
    - better-auth@1.7.24

patchedDependencies:
    # SQLite CHECK introspection and duplicate indexes: https://github.com/drizzle-team/drizzle-orm/issues/4574
    drizzle-kit@0.31.11: patches/drizzle-kit@0.31.11.patch
