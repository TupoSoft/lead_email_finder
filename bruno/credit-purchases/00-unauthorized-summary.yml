info:
    name: 00-unauthorized-summary
    type: http
    seq: 0

http:
    method: GET
    url: '{{baseUrl}}/v1/billing/summary'

runtime:
    assertions:
        - expression: res.status
          operator: eq
          value: '401'
        - expression: res.body.code
          operator: eq
          value: authentication_required
        - expression: Object.keys(res.body)
          operator: length
          value: '1'
        - expression: res.headers['cache-control']
          operator: eq
          value: no-store
