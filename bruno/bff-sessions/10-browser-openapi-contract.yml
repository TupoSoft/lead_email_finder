info:
    name: 10-browser-openapi-contract
    type: http
    seq: 10

http:
    method: GET
    url: '{{baseUrl}}/openapi.json'

runtime:
    assertions:
        - expression: res.status
          operator: eq
          value: '200'
        - expression: res.headers['content-type']
          operator: contains
          value: application/json

        - expression: JSON.stringify(Object.keys(res.body.paths).sort(), null, 2)
          operator: eq
          value: |-
              [
                "/health",
                "/v1/auth/magic-link/verify",
                "/v1/auth/sign-in/magic-link",
                "/v1/auth/sign-out",
                "/v1/billing/summary",
                "/v1/email-verifications",
                "/v1/email-verifications/{id}",
                "/v1/me"
              ]
        - expression: JSON.stringify(Object.keys(res.body.paths['/v1/billing/summary']))
          operator: eq
          value: '["get"]'
        - expression: JSON.stringify(Object.keys(res.body.paths['/v1/email-verifications']))
          operator: eq
          value: '["post"]'
        - expression: JSON.stringify(Object.keys(res.body.paths['/v1/email-verifications/{id}']))
          operator: eq
          value: '["get"]'

        - expression: JSON.stringify(res.body.paths['/v1/email-verifications'].post.security)
          operator: eq
          value: '[{"native_session":[]}]'
        - expression: res.body.paths['/v1/me'].get.operationId
          operator: eq
          value: getCurrentUser
        - expression: JSON.stringify(res.body.paths['/v1/me'].get.security)
          operator: eq
          value: '[{"native_session":[]}]'
        - expression: JSON.stringify(res.body.paths['/v1/auth/sign-out'].post.security)
          operator: eq
          value: '[]'

        - expression: JSON.stringify(res.body.paths['/v1/auth/sign-in/magic-link'].post.security)
          operator: eq
          value: '[]'
        - expression: >-
              JSON.stringify(res.body.paths['/v1/auth/sign-in/magic-link'].post
                .requestBody.content['application/json'].schema.required)
          operator: eq
          value: '["email"]'
        - expression: >-
              JSON.stringify(Object.keys(res.body.paths['/v1/auth/sign-in/magic-link'].post
                .responses['200'].content['application/json'].schema.properties))
          operator: eq
          value: '["status"]'
        - expression: >-
              JSON.stringify(Object.keys(res.body.paths['/v1/auth/sign-in/magic-link'].post
                .responses['200'].content['application/json'].schema.properties.status).sort())
          operator: eq
          value: '["enum","type"]'
        - expression: >-
              res.body.paths['/v1/auth/sign-in/magic-link'].post
                .responses['200'].content['application/json'].schema.properties.status.type
          operator: eq
          value: boolean
        - expression: >-
              JSON.stringify(res.body.paths['/v1/auth/sign-in/magic-link'].post
                .responses['200'].content['application/json'].schema.properties.status.enum)
          operator: eq
          value: '[true]'

        - expression: Object.keys(res.body.paths['/v1/auth/magic-link/verify'].get.responses).includes('200')
          operator: isFalsy
        - expression: Object.keys(res.body.paths['/v1/auth/magic-link/verify'].get.responses['302'])
          operator: notContains
          value: content
        - expression: Object.keys(res.body.paths['/v1/auth/magic-link/verify'].get.responses['302'].headers)
          operator: contains
          value: Location
