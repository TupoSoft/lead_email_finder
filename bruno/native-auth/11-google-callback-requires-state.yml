info:
    name: google-callback-requires-state
    type: http
    seq: 11
http:
    method: GET
    url: '{{baseUrl}}/v1/auth/callback/google?code=synthetic-code'
settings:
    followRedirects: false
runtime:
    assertions:
        - expression: res.status
          operator: eq
          value: '302'
        - expression: res.headers.location
          operator: eq
          value: '{{appOrigin}}/sign-in?error=google-sign-in'
        - expression: res.headers['cache-control']
          operator: eq
          value: no-store
